name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  portable:
    name: Lint and portable tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: |
          go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...
      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          GOOS=windows GOARCH=amd64 "$(go env GOPATH)/bin/staticcheck" ./...
      - name: Test
        run: go test -race ./...
      - name: Cross-compile
        run: |
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=windows GOARCH=arm64 go build ./...

  windows:
    name: Windows tests and build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build
        run: go build -trimpath -ldflags "-H=windowsgui -s -w -X main.version=${{ github.sha }}" -o tuck.exe ./cmd/tuck
      - uses: actions/upload-artifact@v7
        with:
          name: tuck-windows-amd64
          path: tuck.exe
