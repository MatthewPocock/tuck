name: Release

# Pushing a tag such as v0.1.0 tests Tuck on Windows, builds it for x64 and
# ARM64 and publishes a GitHub release with the executables attached.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir dist
          flags="-H=windowsgui -s -w -X main.version=$VERSION"
          GOARCH=amd64 go build -trimpath -ldflags "$flags" -o dist/tuck.exe ./cmd/tuck
          GOARCH=arm64 go build -trimpath -ldflags "$flags" -o dist/tuck-arm64.exe ./cmd/tuck
          cd dist && sha256sum tuck.exe tuck-arm64.exe > checksums.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "Tuck ${{ github.ref_name }}" --generate-notes --verify-tag
